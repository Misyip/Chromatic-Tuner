<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Chromatic Tuner Pro</title>
    
    <!-- Tailwind CSS for modern utility-first styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Google Fonts for modern audio gear aesthetic -->
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    
    <!-- PWA Manifest embedded via Data URI -->
    <link rel="manifest" id="my-manifest">

    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #0b0f19;
            color: #f3f4f6;
            touch-action: manipulation;
        }
        .font-lcd {
            font-family: 'Orbitron', sans-serif;
        }
        /* Smooth transition for the tuning needle */
        .needle-transition {
            transition: transform 0.1s cubic-bezier(0.4, 0, 0.2, 1);
        }
        /* Custom glowing shadow effects */
        .glow-cyan {
            box-shadow: 0 0 25px rgba(6, 182, 212, 0.25);
        }
        .glow-emerald {
            box-shadow: 0 0 35px rgba(16, 185, 129, 0.4);
        }
        .glow-amber {
            box-shadow: 0 0 35px rgba(245, 158, 11, 0.4);
        }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-between items-center p-4 sm:p-6 overflow-x-hidden">

    <header class="w-full max-w-md flex justify-between items-center py-3 px-4 bg-slate-900/60 backdrop-blur-md rounded-2xl border border-slate-800 shadow-xl">
        <div class="flex items-center space-x-2">
            <div class="w-3 h-3 rounded-full bg-cyan-400 animate-pulse"></div>
            <h1 class="font-lcd font-bold tracking-wider text-sm sm:text-base text-cyan-400">CHROMA-TUNE</h1>
        </div>
        <button id="installBtn" class="hidden text-xs bg-slate-800 hover:bg-slate-700 text-cyan-300 px-3 py-1.5 rounded-xl border border-cyan-500/30 transition">
            Install PWA
        </button>
    </header>

    <main class="w-full max-w-md my-auto flex flex-col items-center space-y-6">
        
        <!-- Main Note & Status Card -->
        <div id="tunerCard" class="w-full bg-slate-900/80 backdrop-blur-xl border border-slate-800 rounded-3xl p-6 sm:p-8 flex flex-col items-center relative transition-all duration-300 glow-cyan">
            
            <!-- In-Tune Badge -->
            <div id="tuneStatus" class="absolute top-4 px-3 py-1 rounded-full text-xs font-semibold tracking-wider uppercase bg-slate-800 text-slate-400 border border-slate-700 transition-all duration-300">
                Waiting for audio...
            </div>

            <!-- Note Display -->
            <div class="mt-6 flex flex-col items-center">
                <span id="noteName" class="font-lcd text-7xl sm:text-8xl font-black tracking-tighter text-slate-200">--</span>
                <span id="octaveNum" class="font-lcd text-2xl font-bold text-cyan-400 mt-1">--</span>
            </div>

            <!-- Frequency & Cent Deviation Readout -->
            <div class="mt-4 flex items-center space-x-6 text-sm">
                <div class="flex flex-col items-center">
                    <span class="text-slate-400 text-xs uppercase tracking-wider">Frequency</span>
                    <span id="freqDisplay" class="font-lcd font-semibold text-slate-200 text-base">0.0 Hz</span>
                </div>
                <div class="w-px h-8 bg-slate-800"></div>
                <div class="flex flex-col items-center">
                    <span class="text-slate-400 text-xs uppercase tracking-wider">Deviation</span>
                    <span id="centDisplay" class="font-lcd font-semibold text-slate-200 text-base">0 ct</span>
                </div>
            </div>

            <!-- Strobe / Needle Deviation Meter -->
            <div class="w-full mt-8">
                <!-- Numeric scale labels -->
                <div class="flex justify-between text-[10px] font-lcd text-slate-500 mb-1 px-1">
                    <span>-50</span>
                    <span>-25</span>
                    <span class="text-cyan-400 font-bold">0</span>
                    <span>+25</span>
                    <span>+50</span>
                </div>
                <!-- Meter bar container -->
                <div class="relative w-full h-4 bg-slate-950 rounded-full overflow-hidden border border-slate-800 flex items-center">
                    <!-- Center indicator tick -->
                    <div class="absolute left-1/2 top-0 bottom-0 w-0.5 bg-cyan-400/80 z-10 -translate-x-1/2"></div>
                    <!-- Tick marks -->
                    <div class="absolute inset-x-0 h-full flex justify-between px-2 opacity-30 pointer-events-none">
                        <div class="w-px h-full bg-slate-500"></div>
                        <div class="w-px h-full bg-slate-500"></div>
                        <div class="w-px h-full bg-cyan-400"></div>
                        <div class="w-px h-full bg-slate-500"></div>
                        <div class="w-px h-full bg-slate-500"></div>
                    </div>
                    <!-- Moving Needle -->
                    <div id="needle" class="absolute top-1/2 left-1/2 w-3 h-3 bg-cyan-400 rounded-full shadow-lg shadow-cyan-500/50 -translate-x-1/2 -translate-y-1/2 needle-transition" style="transform: translate(-50%, -50%) translateX(0px);"></div>
                </div>
            </div>

        </div>

        <!-- Microphone Control Button -->
        <button id="toggleMicBtn" class="w-full py-4 px-6 rounded-2xl font-bold tracking-wide text-base bg-gradient-to-r from-cyan-500 to-blue-600 hover:from-cyan-400 hover:to-blue-500 text-white shadow-lg shadow-cyan-500/25 active:scale-[0.98] transition-all flex items-center justify-center space-x-3">
            <svg id="micIcon" xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11a7 7 0 01-7 7m0 0a7 7 0 01-7-7m7 7v4m0 0H8m4 0h4m-4-8a3 3 0 100-6 3 3 0 000 6z" />
            </svg>
            <span id="btnText">Start Tuner / Enable Mic</span>
        </button>

    </main>

    <footer class="w-full max-w-md text-center py-2 text-xs text-slate-500">
        Chromatic Audio Pitch Engine &bull; Auto-Detects A440 Scale
    </footer>

    <script>
        // --- PWA Setup: Dynamic Manifest Generation ---
        const manifestData = {
            "name": "Chromatic Tuner Pro",
            "short_name": "Tuner",
            "start_url": "./index.html",
            "display": "standalone",
            "background_color": "#0b0f19",
            "theme_color": "#0b0f19",
            "icons": [
                {
                    "src": "https://placehold.co/192x192/06b6d4/ffffff?text=T",
                    "sizes": "192x192",
                    "type": "image/png"
                },
                {
                    "src": "https://placehold.co/512x512/06b6d4/ffffff?text=T",
                    "sizes": "512x512",
                    "type": "image/png"
                }
            ]
        };
        const stringManifest = JSON.stringify(manifestData);
        const blob = new Blob([stringManifest], {type: 'application/json'});
        const manifestURL = URL.createObjectURL(blob);
        document.getElementById('my-manifest').setAttribute('href', manifestURL);

        // Register Service Worker for PWA installation support
        if ('serviceWorker' in navigator) {
            const swCode = `
                self.addEventListener('install', e => e.waitUntil(self.skipWaiting()));
                self.addEventListener('activate', e => e.waitUntil(self.clients.claim()));
                self.addEventListener('fetch', e => e.respondWith(fetch(e.request).catch(() => new Response('Offline'))));
            `;
            const swBlob = new Blob([swCode], {type: 'text/javascript'});
            const swURL = URL.createObjectURL(swBlob);
            navigator.serviceWorker.register(swURL).catch(err => console.log('SW registration failed', err));
        }

        // PWA Install Prompt handling
        let deferredPrompt;
        const installBtn = document.getElementById('installBtn');
        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
            deferredPrompt = e;
            installBtn.classList.remove('hidden');
        });
        installBtn.addEventListener('click', async () => {
            if (deferredPrompt) {
                deferredPrompt.prompt();
                const { outcome } = await deferredPrompt.userChoice;
                if (outcome === 'accepted') {
                    installBtn.classList.add('hidden');
                }
                deferredPrompt = null;
            }
        });

        // --- Audio & Pitch Detection Engine ---
        const NOTE_STRINGS = ["C", "C#", "D", "D#", "E", "F", "F#", "G", "G#", "A", "A#", "B"];
        
        let audioContext = null;
        let analyser = null;
        let mediaStream = null;
        let isRunning = false;
        let animationId = null;

        const toggleMicBtn = document.getElementById('toggleMicBtn');
        const btnText = document.getElementById('btnText');
        const noteNameEl = document.getElementById('noteName');
        const octaveNumEl = document.getElementById('octaveNum');
        const freqDisplayEl = document.getElementById('freqDisplay');
        const centDisplayEl = document.getElementById('centDisplay');
        const needleEl = document.getElementById('needle');
        const tuneStatusEl = document.getElementById('tuneStatus');
        const tunerCard = document.getElementById('tunerCard');

        toggleMicBtn.addEventListener('click', toggleTuner);

        async function toggleTuner() {
            if (isRunning) {
                stopTuner();
            } else {
                await startTuner();
            }
        }

        async function startTuner() {
            try {
                audioContext = new (window.AudioContext || window.webkitAudioContext)();
                mediaStream = await navigator.mediaDevices.getUserMedia({ 
                    audio: { 
                        echoCancellation: false, 
                        autoGainControl: false, 
                        noiseSuppression: false 
                    } 
                });
                
                const source = audioContext.createMediaStreamSource(mediaStream);
                analyser = audioContext.createAnalyser();
                analyser.fftSize = 2048;
                source.connect(analyser);

                isRunning = true;
                btnText.textContent = "Stop Tuner";
                toggleMicBtn.classList.remove('from-cyan-500', 'to-blue-600', 'hover:from-cyan-400', 'hover:to-blue-500');
                toggleMicBtn.classList.add('from-rose-500', 'to-red-600', 'hover:from-rose-400', 'hover:to-red-500', 'shadow-rose-500/25');
                
                updatePitch();
            } catch (err) {
                console.error("Microphone permission denied or unavailable:", err);
                alert("Could not access the microphone. Please check browser permissions.");
            }
        }

        function stopTuner() {
            if (mediaStream) {
                mediaStream.getTracks().forEach(track => track.stop());
            }
            if (audioContext && audioContext.state !== 'closed') {
                audioContext.close();
            }
            if (animationId) {
                cancelAnimationFrame(animationId);
            }
            isRunning = false;
            btnText.textContent = "Start Tuner / Enable Mic";
            toggleMicBtn.classList.remove('from-rose-500', 'to-red-600', 'hover:from-rose-400', 'hover:to-red-500', 'shadow-rose-500/25');
            toggleMicBtn.classList.add('from-cyan-500', 'to-blue-600', 'hover:from-cyan-400', 'hover:to-blue-500', 'shadow-cyan-500/25');
            
            // Reset UI
            resetDisplay();
        }

        function resetDisplay() {
            noteNameEl.textContent = "--";
            octaveNumEl.textContent = "--";
            freqDisplayEl.textContent = "0.0 Hz";
            centDisplayEl.textContent = "0 ct";
            needleEl.style.transform = `translate(-50%, -50%) translateX(0px)`;
            tuneStatusEl.textContent = "Waiting for audio...";
            tuneStatusEl.className = "absolute top-4 px-3 py-1 rounded-full text-xs font-semibold tracking-wider uppercase bg-slate-800 text-slate-400 border border-slate-700 transition-all duration-300";
            tunerCard.className = "w-full bg-slate-900/80 backdrop-blur-xl border border-slate-800 rounded-3xl p-6 sm:p-8 flex flex-col items-center relative transition-all duration-300 glow-cyan";
        }

        // Auto-correlation pitch detection algorithm
        function autoCorrelate(buf, sampleRate) {
            let SIZE = buf.length;
            let sumOfSquares = 0;
            for (let i = 0; i < SIZE; i++) {
                let val = buf[i];
                sumOfSquares += val * val;
            }
            let rootMeanSquare = Math.sqrt(sumOfSquares / SIZE);
            if (rootMeanSquare < 0.01) {
                return -1; // Amplitude too low / silence
            }

            let r1 = 0, r2 = SIZE - 1;
            let threshold = 0.2;
            for (let i = 0; i < SIZE / 2; i++) {
                if (Math.abs(buf[i]) < threshold) { r1 = i; break; }
            }
            for (let i = 1; i < SIZE / 2; i++) {
                if (Math.abs(buf[SIZE - i]) < threshold) { r2 = SIZE - i; break; }
            }

            buf = buf.slice(r1, r2);
            SIZE = buf.length;

            let c = new Array(SIZE).fill(0);
            for (let i = 0; i < SIZE; i++) {
                for (let j = 0; j < SIZE - i; j++) {
                    c[i] = c[i] + buf[j] * buf[j + i];
                }
            }

            let d = 0;
            while (c[d] > c[d + 1]) d++;
            let maxval = -1, maxpos = -1;
            for (let i = d; i < SIZE; i++) {
                if (c[i] > maxval) {
                    maxval = c[i];
                    maxpos = i;
                }
            }
            let T0 = maxpos;

            // Parabolic interpolation for higher precision
            let x1 = c[T0 - 1], x2 = c[T0], x3 = c[T0 + 1];
            let a = (x1 + x3 - 2 * x2) / 2;
            let b = (x3 - x1) / 2;
            if (a) {
                T0 = T0 - b / (2 * a);
            }

            return sampleRate / T0;
        }

        function noteFromPitch(frequency) {
            let noteNum = 12 * (Math.log(frequency / 440) / Math.log(2));
            return Math.round(noteNum) + 69;
        }

        function frequencyFromNoteNumber(note) {
            return 440 * Math.pow(2, (note - 69) / 12);
        }

        function centsOffFromPitch(frequency, note) {
            return Math.floor(1200 * Math.log(frequency / frequencyFromNoteNumber(note)) / Math.log(2));
        }

        function updatePitch() {
            if (!isRunning) return;

            const buffer = new Float32Array(analyser.fftSize);
            analyser.getFloatTimeDomainData(buffer);
            let acFreq = autoCorrelate(buffer, audioContext.sampleRate);

            if (acFreq === -1) {
                // Low signal or silence
                tuneStatusEl.textContent = "Listening...";
                tuneStatusEl.className = "absolute top-4 px-3 py-1 rounded-full text-xs font-semibold tracking-wider uppercase bg-slate-800 text-slate-400 border border-slate-700 transition-all duration-300";
            } else {
                let pitch = acFreq;
                freqDisplayEl.textContent = pitch.toFixed(1) + " Hz";

                let note = noteFromPitch(pitch);
                let noteName = NOTE_STRINGS[note % 12];
                let octave = Math.floor(note / 12) - 1;
                let detune = centsOffFromPitch(pitch, note);

                noteNameEl.textContent = noteName;
                octaveNumEl.textContent = octave;
                centDisplayEl.textContent = (detune > 0 ? "+" + detune : detune) + " ct";

                // Needle mapping (-50 to +50 cents maps to container width offset roughly -130px to +130px)
                let maxPx = 130;
                let pxOffset = (detune / 50) * maxPx;
                if (pxOffset > maxPx) pxOffset = maxPx;
                if (pxOffset < -maxPx) pxOffset = -maxPx;
                needleEl.style.transform = `translate(-50%, -50%) translateX(${pxOffset}px)`;

                // In-tune status threshold: within +/- 3 cents
                if (Math.abs(detune) <= 3) {
                    tuneStatusEl.textContent = "In Tune !";
                    tuneStatusEl.className = "absolute top-4 px-3 py-1 rounded-full text-xs font-semibold tracking-wider uppercase bg-emerald-500/20 text-emerald-400 border border-emerald-500/40 transition-all duration-300";
                    needleEl.style.backgroundColor = "#10b981";
                    tunerCard.className = "w-full bg-slate-900/80 backdrop-blur-xl border border-emerald-500/40 rounded-3xl p-6 sm:p-8 flex flex-col items-center relative transition-all duration-300 glow-emerald";
                } else if (detune > 0) {
                    tuneStatusEl.textContent = "Too Sharp (Lower)";
                    tuneStatusEl.className = "absolute top-4 px-3 py-1 rounded-full text-xs font-semibold tracking-wider uppercase bg-amber-500/20 text-amber-400 border border-amber-500/40 transition-all duration-300";
                    needleEl.style.backgroundColor = "#f59e0b";
                    tunerCard.className = "w-full bg-slate-900/80 backdrop-blur-xl border border-amber-500/40 rounded-3xl p-6 sm:p-8 flex flex-col items-center relative transition-all duration-300 glow-amber";
                } else {
                    tuneStatusEl.textContent = "Too Flat (Raise)";
                    tuneStatusEl.className = "absolute top-4 px-3 py-1 rounded-full text-xs font-semibold tracking-wider uppercase bg-amber-500/20 text-amber-400 border border-amber-500/40 transition-all duration-300";
                    needleEl.style.backgroundColor = "#f59e0b";
                    tunerCard.className = "w-full bg-slate-900/80 backdrop-blur-xl border border-amber-500/40 rounded-3xl p-6 sm:p-8 flex flex-col items-center relative transition-all duration-300 glow-amber";
                }
            }

            animationId = requestAnimationFrame(updatePitch);
        }
    </script>

</body>
</html>
